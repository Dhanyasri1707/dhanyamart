<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DhanyaMart - Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f7f5;
            color: #333;
        }

        header {
            background-color: #2e7d32;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 17px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .welcome {
            text-align: center;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .search-box input {
            width: 500px;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-box button {
            padding: 13px 22px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .search-box button:hover {
            background-color: #1b5e20;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .product-card {
            background-color: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .product-card h2 {
            color: #2e7d32;
            margin-bottom: 15px;
            font-size: 21px;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .seller {
            color: #666;
            margin-bottom: 20px;
        }

        .cart-button {
            width: 100%;
            padding: 10px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .cart-button:hover {
            background-color: #1b5e20;
        }

        .review-button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background-color: white;
            color: #2e7d32;
            border: 1px solid #2e7d32;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .review-button:hover {
            background-color: #e8f5e9;
        }

        .empty {
            text-align: center;
            margin-top: 40px;
            font-size: 18px;
            color: #666;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .products {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
                align-items: center;
            }

            .search-box input {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>DhanyaMart</h1>
    <p>Online Shopping System</p>
</header>

<div class="container">

    <div class="welcome">
        Welcome,
        <strong th:text="${username}">Customer</strong>
    </div>

    <!-- Search -->
    <form action="/products" method="get" class="search-box">

        <input
            type="text"
            name="search"
            placeholder="Search products..."
            th:value="${search}"
        >

        <input
            type="hidden"
            name="username"
            th:value="${username}"
        >

        <button type="submit">
            Search
        </button>

    </form>

    <!-- Products -->
    <div class="products">

        <div
            class="product-card"
            th:each="product : ${products}"
        >

            <h2 th:text="${product.name}">
                Product Name
            </h2>

            <div class="price">
                ₹<span th:text="${product.price}">0</span>
            </div>

            <div class="seller">
                Seller:
                <span th:text="${product.seller}">
                    DhanyaMart
                </span>
            </div>

            <!-- Add to Cart -->
            <form action="/cart/add" method="post">

                <input
                    type="hidden"
                    name="productId"
                    th:value="${product.id}"
                >

                <input
                    type="hidden"
                    name="username"
                    th:value="${username}"
                >

                <button type="submit" class="cart-button">
                    Add to Cart
                </button>

            </form>

            <!-- Review -->
            <form action="/review" method="get">

                <input
                    type="hidden"
                    name="productId"
                    th:value="${product.id}"
                >

                <input
                    type="hidden"
                    name="username"
                    th:value="${username}"
                >

                <button type="submit" class="review-button">
                    Review
                </button>

            </form>

        </div>

    </div>

    <!-- No products -->
    <div
        class="empty"
        th:if="${products == null or #lists.isEmpty(products)}"
    >
        No products found.
    </div>

</div>

</body>
</html>
