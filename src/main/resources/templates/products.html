<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DhanyaMart - Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            padding: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .search-button {
            padding: 12px 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .search-button:hover {
            background: #1b5e20;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .product-card h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
        }

        .seller {
            color: #666;
        }

        .cart-button,
        .review-button {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .cart-button {
            background: #2e7d32;
        }

        .cart-button:hover {
            background: #1b5e20;
        }

        .review-button {
            background: #558b2f;
        }

        .review-button:hover {
            background: #33691e;
        }

        .empty {
            text-align: center;
            color: #666;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<header>
    <h1>DhanyaMart</h1>
    <p>Our Products</p>
</header>

<div class="container">

    <!-- Product Search -->
    <form action="/products" method="get" class="search-box">

        <input
                type="text"
                name="search"
                th:value="${search}"
                placeholder="Search products..."
        >

        <button type="submit" class="search-button">
            🔍 Search
        </button>

    </form>

    <div class="products">

        <div class="product-card" th:each="product : ${products}">

            <h2 th:text="${product.name}">Product Name</h2>

            <p class="price">
                ₹<span th:text="${product.price}">0</span>
            </p>

            <p class="seller">
                Seller: <span th:text="${product.seller}">Seller</span>
            </p>

            <form action="/cart/add" method="post">

                <input type="hidden"
                       name="productId"
                       th:value="${product.id}">

                <input type="hidden"
                       name="username"
                       value="YOUR_USERNAME">

                <button type="submit" class="cart-button">
                    Add to Cart 🛒
                </button>

            </form>

            <a th:href="@{/reviews(productId=${product.id})}">
                <button type="button" class="review-button">
                    ⭐ Reviews
                </button>
            </a>

        </div>

    </div>

    <div class="empty" th:if="${#lists.isEmpty(products)}">
        <p>No products available yet.</p>
    </div>

</div>

</body>
</html>
