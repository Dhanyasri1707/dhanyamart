<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DhanyaMart - Reviews</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f7f5;
            color: #333;
        }

        header {
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
        }

        .product-box,
        .review-form,
        .review-card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .product-box h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .product-price {
            font-weight: bold;
            margin-top: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 11px 20px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .username {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 8px;
        }

        .rating {
            color: #e6a700;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .comment {
            color: #444;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2e7d32;
            text-decoration: none;
        }

        .no-reviews {
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>DhanyaMart</h1>
    <p>Product Reviews</p>
</header>

<div class="container">

    <a
        class="back"
        th:href="@{/products(username=${username})}">
        ← Back to Products
    </a>

    <!-- PRODUCT INFORMATION -->

    <div class="product-box">

        <h2>
            Product:
            <span th:text="${product != null ? product.name : 'Product'}">
                Wheat
            </span>
        </h2>

        <div
            class="product-price"
            th:if="${product != null}"
        >
            Price:
            ₹<span th:text="${product.price}">0</span>
        </div>

        <div
            th:if="${product != null}"
        >
            Seller:
            <span th:text="${product.seller}">
                DhanyaMart
            </span>
        </div>

    </div>


    <!-- WRITE REVIEW -->

    <div class="review-form">

        <h2>Write a Review</h2>

        <form action="/review" method="post">

            <input
                type="hidden"
                name="productId"
                th:value="${productId}"
            >

            <input
                type="hidden"
                name="username"
                th:value="${username}"
            >

            <label for="rating">
                Rating
            </label>

            <select
                id="rating"
                name="rating"
                required
            >
                <option value="5">★★★★★ - Excellent</option>
                <option value="4">★★★★ - Very Good</option>
                <option value="3">★★★ - Good</option>
                <option value="2">★★ - Average</option>
                <option value="1">★ - Poor</option>
            </select>

            <label for="comment">
                Comment
            </label>

            <textarea
                id="comment"
                name="comment"
                placeholder="Write your review..."
                required
            ></textarea>

            <button type="submit">
                Submit Review
            </button>

        </form>

    </div>


    <!-- CUSTOMER REVIEWS -->

    <h2>Customer Reviews</h2>

    <br>

    <div
        class="review-card"
        th:each="review : ${reviews}"
    >

        <div class="username">
            Customer:
            <span th:text="${review.username}">
                Customer
            </span>
        </div>

        <div class="rating">
            <span th:text="${review.rating}">
                5
            </span>
            / 5
            ⭐
        </div>

        <div
            class="comment"
            th:text="${review.comment}"
        >
            Great product!
        </div>

    </div>

    <div
        class="no-reviews"
        th:if="${reviews == null or #lists.isEmpty(reviews)}"
    >
        No reviews yet. Be the first to review this product!
    </div>

</div>

</body>
</html>
