<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DhanyaMart - Cart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .cart-item h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .price,
        .quantity,
        .total {
            margin-top: 8px;
        }

        .total {
            font-weight: bold;
        }

        .empty {
            text-align: center;
            margin-top: 50px;
            color: #666;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>DhanyaMart</h1>
    <p>My Cart 🛒</p>
</header>

<div class="container">

    <div th:if="${#lists.isEmpty(cartItems)}" class="empty">
        <h2>Your cart is empty</h2>
    </div>

    <div th:each="item : ${cartItems}" class="cart-item">

        <div th:each="product : ${products}">

            <div th:if="${product.id == item.productId}">

                <h2 th:text="${product.name}">
                    Product Name
                </h2>

                <p class="price">
                    Price: ₹<span th:text="${product.price}">0</span>
                </p>

                <p class="quantity">
                    Quantity:
                    <span th:text="${item.quantity}">1</span>
                </p>

                <p class="total">
                    Total: ₹<span th:text="${product.price * item.quantity}">0</span>
                </p>

            </div>

        </div>

    </div>

    <a href="/products" class="back">
        ← Continue Shopping
    </a>

</div>

</body>
</html>
