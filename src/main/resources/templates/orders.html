<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DhanyaMart - Orders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .order-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .order-card h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .order-info {
            margin-top: 8px;
        }

        .status {
            margin-top: 12px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            margin-top: 50px;
            color: #666;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>DhanyaMart</h1>
    <p>My Orders 📦</p>
</header>

<div class="container">

    <div th:if="${#lists.isEmpty(orders)}" class="empty">
        <h2>No orders yet</h2>
        <p>Your placed orders will appear here.</p>
    </div>

    <div th:each="order : ${orders}" class="order-card">

        <div th:each="product : ${products}">

            <div th:if="${product.id == order.productId}">

                <h2 th:text="${product.name}">
                    Product Name
                </h2>

                <p class="order-info">
                    Price: ₹<span th:text="${product.price}">0</span>
                </p>

                <p class="order-info">
                    Quantity:
                    <span th:text="${order.quantity}">1</span>
                </p>

                <p class="order-info">
                    Total: ₹<span th:text="${order.total}">0</span>
                </p>

                <p class="status">
                    Status:
                    <span th:text="${order.status}">PLACED</span>
                </p>

            </div>

        </div>

    </div>

    <a href="/products" class="back">
        ← Continue Shopping
    </a>

</div>

</body>
</html>
